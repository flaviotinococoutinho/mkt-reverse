spring:
  datasource:
    url: jdbc:h2:mem:gateway_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  main:
    allow-bean-definition-overriding: true
server:
  port: 0

marketplace:
  messaging:
    # No broker in tests — the outbox still accumulates (and is asserted on);
    # only the drain to RabbitMQ is disabled.
    relay-enabled: false
