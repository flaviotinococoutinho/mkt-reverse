spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_main
    username: marketplace_user
    password: marketplace_pass

  # No MVP o schema é gerido pelo Hibernate (ddl-auto: update); Flyway fica
  # desligado no profile local/CI para não competir com o ddl-auto em banco
  # fresh. Quando o Flyway virar a autoridade de schema (pós-MVP), religar
  # aqui e congelar o ddl-auto em validate.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8081
